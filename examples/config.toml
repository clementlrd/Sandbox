# Default configuration for the bundled runtimes.
[sandbox]
memory = "8g"
pids_limit = 512
network = "bridge"                # or "none"
forward_env = []                  # names of explicitly forwarded host variables
shared_tools = true              # host tools dir -> /opt/tools (read-only)
default_runtime = "base"        # must name a configured runtime

# The preparer is a trusted, network-isolated Git preparation image, NOT a runtime.
[preparer]
image = "sandbox/preparer:v1"

# All runtimes use exactly the same schema, including the bundled examples.
# 'bundled:' resolves under the installed $XDG_DATA_HOME/sandbox directory.
[runtimes.base]
image = "sandbox/base:v1"
shell = "/bin/bash"
venv_volume = true
devices = []
dockerfile = "bundled:images/base/Dockerfile"
context = "bundled:."

[runtimes.python-xpu]
image = "sandbox/python-xpu:v1"
shell = "/bin/bash"
venv_volume = true
devices = []                      # e.g. ["/dev/dri/renderD128"]
dockerfile = "bundled:images/python-xpu/Dockerfile"
context = "bundled:."

# Third-party runtimes may omit dockerfile/context and use an already built image:
# [runtimes.node]
# image = "node:22-bookworm"
# shell = "/bin/bash"
# venv_volume = false
# devices = []
# Or build an image from a small user-owned Dockerfile/context.

# Generic read-only mounts. These are not OpenCode-specific; examples are optional.
[[mounts]]
source = "~/.config/opencode/skills"
target = "/root/.config/opencode/skills"
optional = true

[[mounts]]
source = "~/.agents/skills"
target = "/root/.agents/skills"
optional = true

[[mounts]]
source = "~/.claude/skills"
target = "/root/.claude/skills"
optional = true

[[mounts]]
source = "~/.config/sandbox/apps/opencode.jsonc"
target = "/root/.config/opencode/opencode.jsonc"
optional = true

[setup]
recipes_dir = "~/.config/sandbox/recipes"
confirm_host_execution = true
